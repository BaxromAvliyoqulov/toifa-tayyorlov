<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- Target Outer White Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="3.5" opacity="0.95" />

  <!-- Target Middle Ring (Cyan/Light Blue) -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.9" />

  <!-- Target Bullseye Center (Gold Achievement Star / Dot) -->
  <circle cx="32" cy="32" r="7" fill="url(#goldGrad)" />

  <!-- Center Arrow / Star Sparkle -->
  <path d="M32 20 L33.5 28 L32 27 L30.5 28 Z" fill="#ffffff" opacity="0.9"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />
</svg>
